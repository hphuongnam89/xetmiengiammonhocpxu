<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập</title><style>body{font:16px system-ui;background:#f4f6fa;display:grid;place-items:center;min-height:100vh;color:#172033}.box{background:#fff;padding:28px;border-radius:12px;width:min(360px,90vw);box-shadow:0 2px 15px #17203318}label,input{display:block;width:100%;box-sizing:border-box;margin:10px 0}input{padding:10px;border:1px solid #cbd5e1;border-radius:6px}button{padding:10px 16px;background:#174ea6;color:#fff;border:0;border-radius:6px}</style><section class="box"><h1>Đăng nhập</h1>{% if form.errors %}<p>Tên đăng nhập hoặc mật khẩu chưa đúng.</p>{% endif %}<form method="post">{% csrf_token %}<label>Tên đăng nhập{{ form.username }}</label><label>Mật khẩu{{ form.password }}</label><input type="hidden" name="next" value="{{ next }}"><button type="submit">Đăng nhập</button></form></section></html>
