<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo hồ sơ</title><style>body{font:16px system-ui;background:#f4f6fa;color:#172033}main{max-width:680px;margin:32px auto;background:white;padding:24px;border-radius:12px}label{display:block;margin:14px 0}input,select{display:block;box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px}button{padding:11px 18px;background:#174ea6;color:white;border:0;border-radius:6px}a{color:#1558a6}.hint{color:#596477}</style><main><p><a href="{% url 'dashboard' %}">← Bảng công việc</a></p><h1>Tạo hồ sơ xét miễn môn</h1>{% for message in messages %}<p>{{ message }}</p>{% endfor %}<form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Mã sinh viên<input name="student_code" maxlength="100" required></label><label>Họ và tên<input name="full_name" maxlength="255" required></label><label>Ngành đích đăng ký tại PXU<select name="program_code" required><option value="">Chọn ngành đích</option>{% for program in programs %}<option value="{{ program.code }}">{{ program.name }} ({{ program.code }})</option>{% endfor %}</select></label><p class="hint">Ngành đích là chương trình đang đăng ký tại PXU. Ngành/bậc học trước đây được AI đọc từ hồ sơ, không dùng để lọc khung đích.</p><label>Loại tài liệu<select name="document_type"><option value="TRANSCRIPT">Bảng điểm</option><option value="DIPLOMA">Bằng tốt nghiệp</option><option value="CERTIFICATE">Chứng chỉ</option><option value="OTHER">Khác</option></select></label><label>Giáo viên phụ trách<select name="teacher_id"><option value="">Chưa phân công</option>{% for profile in teachers %}<option value="{{ profile.user_id }}">{{ profile.user.get_full_name|default:profile.user.username }}</option>{% endfor %}</select></label><label>Tệp PDF/JPG/PNG, tối đa 10 MB<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required></label><button type="submit">Tạo hồ sơ và tải lên</button></form></main></html>
